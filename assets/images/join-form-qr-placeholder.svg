<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="招人收集表二维码占位图，待替换为 WPS 收集表的二维码">
  <title>招人收集表二维码占位图（待替换）</title>
  <rect width="480" height="480" fill="#F6F9FE"/>
  <rect x="14" y="14" width="452" height="452" fill="none" stroke="#a9bedf" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- 三个定位角：说明这是一张二维码的位置 -->
  <g fill="none" stroke="#c3d6f5" stroke-width="10">
    <rect x="64" y="64" width="84" height="84"/>
    <rect x="332" y="64" width="84" height="84"/>
    <rect x="64" y="332" width="84" height="84"/>
  </g>
  <g fill="#c3d6f5">
    <rect x="92" y="92" width="28" height="28"/>
    <rect x="360" y="92" width="28" height="28"/>
    <rect x="92" y="360" width="28" height="28"/>
  </g>

  <text x="240" y="222" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#5b6f92">二维码待替换</text>
  <text x="240" y="262" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#6d7789">替换为 WPS 在线收集表</text>
  <text x="240" y="288" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#6d7789">导出的二维码图片</text>
</svg>
